extend schema
  @link(url: "https://specs.apollo.dev/federation/v2.0",
        import: ["@key"])

# Placeholder schema for the BigCommerce Catalog subgraph.
#
# The full BigCommerce Catalog API (https://developer.bigcommerce.com/graphql-api-reference)
# is intentionally NOT mapped here -- it's large and store-specific, and mapping
# it up front means inheriting someone else's product model instead of building
# your own. Replace this placeholder with types and queries shaped to the
# catalog data your storefront actually needs.

type Query {
  "Confirms the catalog subgraph is wired into the gateway. Replace with real catalog queries."
  CatalogPlaceholder: CatalogPlaceholderResult!
}

type CatalogPlaceholderResult {
  data: CatalogPlaceholderData!
}

type CatalogPlaceholderData @key(fields: "id") {
  id: ID!
  message: String!
}
